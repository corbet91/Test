services:
  db:
    image: postgres:16-alpine
    container_name: revenue-dashboard-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: revenue_dashboard
    ports:
      - "5432:5432"
    volumes:
      - revenue_dashboard_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d revenue_dashboard"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  revenue_dashboard_pgdata:
